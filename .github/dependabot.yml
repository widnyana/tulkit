version: 2
updates:
  # npm ecosystem covers pnpm-lock.yaml
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Cooldown: don't open update PRs for versions younger than N days, so a
    # freshly-published compromised release isn't proposed during its live window.
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3

  # Keep the CI actions we add below pinned and patched too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
